name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll
          cp robots.txt _site/robots.txt 2>/dev/null || true
          cp llms.txt _site/llms.txt 2>/dev/null || true
          cp llms-full.txt _site/llms-full.txt 2>/dev/null || true
          cp -r assets _site/assets 2>/dev/null || true
          cp -r docs _site/docs 2>/dev/null || true
          cp README.md _site/README.md 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
